# Release: publish to PyPI and npm with trusted publishing (no stored tokens).
#
# Lives in the PUBLIC repo youam-network/uam at .github/workflows/release.yml.
# The private-to-public sync keeps the public repo's .github as it is, so this
# file is changed here, by PR on the public repo.
#
#   v1.0.1          -> builds and publishes the `youam` Python package to PyPI
#   ts-sdk-v0.2.1   -> builds, tests and publishes `@youam/sdk` to npm
#
# Each publish job runs in a GitHub environment (pypi, npm) limited to its tag
# pattern, with Amir as required reviewer. PyPI and npm each trust exactly
# this repo + this file + that environment.
#
# Build jobs run the package's own code and hold no publish token. Publish jobs
# hold the token and run only pinned actions on the built artifact.
#
# The "tag is on main" check lives in this file, so a tag on another branch
# could carry a copy without it. The tag ruleset and the environment reviewers
# are what stop that; the check catches honest mistakes.

name: Release

on:
  push:
    tags: ['v*', 'ts-sdk-v*']

permissions:
  contents: read

jobs:
  python-build:
    name: Build youam
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          code=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/uam/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$meta __version__=$code"
          [ "$tag" = "$meta" ] && [ "$tag" = "$code" ]
      - name: Build
        run: |
          pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: Check the wheel and sdist contain only public code
        run: |
          if python -m zipfile -l dist/*.whl | grep -E 'uam/registrar/'; then
            echo "private code in the wheel"; exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -E 'uam/registrar/'; then
            echo "private code in the sdist"; exit 1
          fi
      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import uam, sys; assert uam.__version__ == sys.argv[1], uam.__version__" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  python-publish:
    name: Publish youam to PyPI
    needs: python-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/youam/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm-build:
    name: Build @youam/sdk
    if: startsWith(github.ref_name, 'ts-sdk-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#ts-sdk-v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$pkg"
          [ "$tag" = "$pkg" ]
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Install the packed tarball in a clean project
        run: npm run smoke:tarball
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: ts-sdk/*.tgz
          if-no-files-found: error

  # No checkout and no install here: this job holds the publish token, so it
  # runs only the tarball built above and the npm that ships with Node.
  npm-publish:
    name: Publish @youam/sdk to npm
    needs: npm-build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@youam/sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1+; this Node ships npm 11.19.1.
          node-version: '24.22.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish dist/*.tgz --access public --ignore-scripts
